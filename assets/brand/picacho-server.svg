<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" role="img" aria-labelledby="logo-title logo-desc">
<title id="logo-title">Picacho Server</title>
<desc id="logo-desc">Three stacked green server units forming the peak above the negative-space envelope flap, separated by negative space from the same dark teal rising horizon as the Picacho mark.</desc>
<defs>
      <linearGradient id="peak-gradient" x1="40" y1="60" x2="600" y2="400" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#35CD58"/>
        <stop offset="0.55" stop-color="#18B965"/>
        <stop offset="1" stop-color="#008D77"/>
      </linearGradient>
      <linearGradient id="base-gradient" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#003D40"/>
        <stop offset="1" stop-color="#005353"/>
      </linearGradient>
      <clipPath id="peak-shape">
        <path d="M 40 396 L 40 352 L 222 201 Q 228 196 235 200 L 258 214 L 318 88 Q 330 64 344 86 L 600 352 L 600 396 Q 600 403 592 397 C 550 362 493 339 432 327 Q 320 306 208 327 C 147 339 90 362 48 397 Q 40 403 40 396 Z"/>
      </clipPath>
    </defs>
<g id="flap" clip-path="url(#peak-shape)" fill="url(#peak-gradient)">
        <path id="peak-lower" d="M 0 216 L 320 282 L 640 216 L 640 540 L 0 540 Z"/>
      </g>
<g id="servers" fill="url(#peak-gradient)">
        <rect id="server-top" x="264" y="68" width="128" height="46" rx="11"/>
        <rect id="server-middle" x="222" y="132" width="211" height="46" rx="11"/>
        <path id="server-bottom" d="M 183 233.7 L 186.5 207 Q 188 196 199 196 L 459 196 Q 469 196 471.5 205 L 481 228.4 L 320 262 Z"/>
      </g>
<g id="status" fill="#00494A">
        <rect x="310" y="88" width="41" height="6.2" rx="3.1"/>
        <circle cx="368" cy="91" r="6.5"/>
        <rect x="330" y="152" width="62" height="6.2" rx="3.1"/>
        <circle cx="409" cy="155" r="6.5"/>
        <rect x="373" y="211" width="62" height="6.2" rx="3.1"/>
        <circle cx="452" cy="214" r="6.5"/>
      </g>
      <path id="lower-horizon" d="M 40 500 A 280 142 0 0 1 600 500 L 40 500 Z" fill="url(#base-gradient)"/>
</svg>
